services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: teamhub_erp
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [teamhub]

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/teamhub_erp?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REMEMBER_EXPIRES_IN: ${JWT_REMEMBER_EXPIRES_IN:-30d}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      TRUST_PROXY: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-teamhub.sid}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-teamhub.csrf}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1mb}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      SHIFT_DAY_CUTOFF_HOUR: ${SHIFT_DAY_CUTOFF_HOUR:-10}
    volumes:
      - uploads_data:/app/uploads
    networks: [teamhub]

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-teamhub.csrf}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [teamhub]

volumes:
  mongo_data:
  uploads_data:

networks:
  teamhub:
    driver: bridge
